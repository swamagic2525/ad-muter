<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --fg: #1f1f1f; --muted: #5f6368; --bg: #fff; --line: #e3e3e3; --accent: #1a73e8; --ad: #d93025; --ok: #188038; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8eaed; --muted: #9aa0a6; --bg: #202124; --line: #3c4043; --accent: #8ab4f8; --ad: #f28b82; --ok: #81c995; }
    }
    body { margin: 0; width: 320px; font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 14px; margin: 0; }
    section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .row + .row { margin-top: 8px; }
    .status { margin-top: 8px; font-weight: 600; }
    .status.ad { color: var(--ad); }
    .status.ok { color: var(--ok); }
    .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--accent); cursor: pointer; }
    textarea { width: 100%; box-sizing: border-box; height: 140px; margin-top: 8px; font: 11px/1.3 ui-monospace, monospace; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; }
    footer { padding: 10px 14px; color: var(--muted); font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Ad Muter</h1>
    <label><input type="checkbox" id="enabled"> On</label>
  </header>

  <section id="site-section">
    <div class="row">
      <span id="site-name">Not a supported site</span>
      <label id="site-toggle-label" hidden><input type="checkbox" id="site-enabled"> Enabled here</label>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section id="capture-section" hidden>
    <div class="row">
      <span>Detection not working?</span>
      <button id="capture">Capture player</button>
    </div>
    <p class="hint">Click this while an ad is playing, then copy the result and send it to whoever maintains the selectors in sites.js.</p>
    <div id="capture-out" hidden>
      <textarea id="capture-text" readonly></textarea>
      <div class="row"><span></span><button id="copy">Copy</button></div>
    </div>
  </section>

  <section>
    <label><input type="checkbox" id="debug"> Debug logging (page console)</label>
  </section>

  <footer id="count"></footer>

  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
